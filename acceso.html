<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Privacidad.me</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{void:'#05070a',panel:'#0b0f14',neon:'#0a84ff',steel:'#8b9bb4',mist:'#c5d0e0'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{background:#05070a}</style>
</head>
<body class="font-sans text-mist antialiased min-h-screen flex flex-col">
<nav class="border-b border-white/5 h-14 flex items-center px-6 justify-between">
  <a href="index.html" class="font-semibold text-white text-sm">privacidad<span class="text-neon">.me</span></a>
  <a href="registro.html" class="text-sm text-steel hover:text-white">Crear cuenta</a>
</nav>
<main class="flex-1 flex items-center justify-center px-6 py-16">
  <div class="w-full max-w-sm">
    <h1 class="text-xl font-bold text-white text-center mb-6">Iniciar sesión</h1>
    <form class="p-6 rounded-2xl bg-panel border border-white/10 space-y-4" onsubmit="event.preventDefault(); location.href='panel.html'">
      <input type="email" placeholder="Correo" required class="w-full bg-void border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
      <input type="password" placeholder="Contraseña" required class="w-full bg-void border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
      <button type="submit" class="w-full py-3 rounded-xl bg-neon text-void font-semibold text-sm">Entrar</button>
      <p class="text-center text-xs text-steel">Modo demo: cualquier dato te lleva al panel.</p>
    </form>
  </div>
</main>
</body>
</html>
