<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de control — Privacidad.me</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{void:'#05070a',panel:'#0b0f14',neon:'#0a84ff','neon-glow':'#3b9eff',steel:'#8b9bb4',mist:'#c5d0e0'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{background:#05070a}.glow-blue{box-shadow:0 0 20px rgba(10,132,255,.2)}.sidebar-link.active{background:rgba(10,132,255,.1);color:#0a84ff;border-color:rgba(10,132,255,.3)}</style>
</head>
<body class="font-sans text-mist antialiased min-h-screen flex">
<aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-panel border-r border-white/5 transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
<div class="flex flex-col h-full">
<div class="h-16 flex items-center gap-3 px-5 border-b border-white/5">
<div class="w-8 h-8 rounded-lg bg-neon/10 border border-neon/30 flex items-center justify-center"><svg class="w-4 h-4 text-neon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
<span class="font-semibold text-white">privacidad<span class="text-neon">.me</span></span>
</div>
<nav class="flex-1 p-4 space-y-1">
<button onclick="showSection('enlaces')" class="sidebar-link active w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm border border-transparent hover:bg-white/5" data-section="enlaces">Enlaces</button>
<button onclick="showSection('apariencia')" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm border border-transparent hover:bg-white/5" data-section="apariencia">Apariencia</button>
<button onclick="showSection('perfil')" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm border border-transparent hover:bg-white/5" data-section="perfil">Perfil</button>
<button onclick="showSection('ajustes')" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm border border-transparent hover:bg-white/5" data-section="ajustes">Ajustes</button>
</nav>
<div class="p-4 border-t border-white/5">
<div class="flex items-center gap-3">
<img src="https://pbs.twimg.com/profile_images/1691362458655440896/jaacLom0.jpg" class="w-9 h-9 rounded-full object-cover border border-white/10">
<div class="flex-1 min-w-0"><div class="text-sm font-medium text-white truncate">Stark</div><div class="text-xs text-steel truncate">privtr.ee/stark</div></div>
<a href="index.html" class="text-steel hover:text-white">Salir</a>
</div>
</div>
</div>
</aside>
<div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>
<div class="flex-1 lg:ml-64 min-h-screen flex flex-col">
<header class="h-16 border-b border-white/5 bg-void/80 backdrop-blur-xl flex items-center justify-between px-4 sm:px-6 sticky top-0 z-20">
<div class="flex items-center gap-3">
<button onclick="toggleSidebar()" class="lg:hidden p-2 text-steel">☰</button>
<h1 id="page-title" class="text-lg font-semibold text-white">Enlaces</h1>
</div>
<button onclick="saveAll()" class="px-4 py-2 rounded-xl bg-neon text-void text-sm font-semibold glow-blue">Guardar</button>
</header>
<main class="flex-1 p-4 sm:p-6 max-w-4xl mx-auto w-full">
<section id="section-enlaces" class="space-y-6">
<div class="flex justify-between items-center"><p class="text-sm text-steel">Gestiona tus enlaces</p><button onclick="addLink()" class="px-4 py-2 rounded-xl border border-neon/30 text-neon text-sm">+ Añadir</button></div>
<div id="links-list" class="space-y-3"></div>
</section>
<section id="section-apariencia" class="hidden space-y-6">
<h3 class="text-white font-medium">Tema</h3>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
<button class="p-4 rounded-xl border-2 border-neon bg-void text-center text-xs text-steel">Oscuro</button>
<button class="p-4 rounded-xl border border-white/10 bg-panel text-center text-xs text-steel">Azul</button>
<button class="p-4 rounded-xl border border-white/10 bg-panel text-center text-xs text-steel">Violeta</button>
<button class="p-4 rounded-xl border border-white/10 bg-panel text-center text-xs text-steel">Verde</button>
</div>
</section>
<section id="section-perfil" class="hidden space-y-6">
<div class="flex gap-6 items-start">
<img src="https://pbs.twimg.com/profile_images/1691362458655440896/jaacLom0.jpg" class="w-24 h-24 rounded-full object-cover border-2 border-neon/30">
<div class="flex-1 space-y-4">
<input type="text" value="Stark" class="w-full bg-panel border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
<textarea rows="3" class="w-full bg-panel border border-white/10 rounded-xl px-4 py-3 text-sm text-white">Sin privacidad tu libertad es solo una ilusión</textarea>
</div>
</div>
</section>
<section id="section-ajustes" class="hidden space-y-6">
<div class="p-5 rounded-2xl bg-panel border border-white/5">
<h3 class="text-white font-medium mb-3">Usuario y dominio</h3>
<div class="flex items-center bg-void rounded-xl border border-white/10 overflow-hidden">
<select class="bg-transparent text-steel text-sm px-3 py-3 border-r border-white/10"><option>privacidad.me/</option><option selected>privtr.ee/</option><option>privtree.com/</option></select>
<input type="text" value="stark" class="flex-1 bg-transparent text-white px-3 py-3 text-sm">
</div>
</div>
</section>
</main>
</div>
<script>
let links=[{id:1,title:'Academia Boring Privacy',url:'https://boringprivacy.io',active:true},{id:2,title:'Canal de Telegram',url:'https://t.me/StarkPrivacy',active:true},{id:3,title:'X / Twitter',url:'https://x.com/StarkPrivacy',active:true}];
let nextId=4;
function renderLinks(){document.getElementById('links-list').innerHTML=links.map(l=>`<div class="flex items-center gap-3 p-4 rounded-2xl bg-panel border border-white/5"><div class="flex-1 space-y-2"><input value="${l.title}" onchange="updateLink(${l.id},'title',this.value)" class="w-full bg-transparent text-sm text-white"><input value="${l.url}" onchange="updateLink(${l.id},'url',this.value)" class="w-full bg-transparent text-xs text-steel"></div><button onclick="deleteLink(${l.id})" class="text-steel hover:text-red-400">✕</button></div>`).join('')}
function addLink(){links.push({id:nextId++,title:'Nuevo enlace',url:'',active:true});renderLinks()}
function updateLink(id,f,v){const l=links.find(x=>x.id===id);if(l)l[f]=v}
function deleteLink(id){if(confirm('¿Eliminar?')){links=links.filter(x=>x.id!==id);renderLinks()}}
function showSection(n){document.querySelectorAll('[id^=section-]').forEach(e=>e.classList.add('hidden'));document.getElementById('section-'+n).classList.remove('hidden');document.querySelectorAll('.sidebar-link').forEach(e=>e.classList.remove('active'));document.querySelector('[data-section="'+n+'"]').classList.add('active');document.getElementById('page-title').textContent={enlaces:'Enlaces',apariencia:'Apariencia',perfil:'Perfil',ajustes:'Ajustes'}[n];document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebar-overlay').classList.add('hidden')}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('-translate-x-full');document.getElementById('sidebar-overlay').classList.toggle('hidden')}
function saveAll(){const b=event.target;b.textContent='Guardado ✓';setTimeout(()=>b.textContent='Guardar',1500)}
renderLinks();
</script>
</body>
</html>
