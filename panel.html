<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Privacidad.me</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{void:'#05070a',panel:'#0b0f14',neon:'#0a84ff',steel:'#8b9bb4',mist:'#c5d0e0'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
<style>
body{background:#05070a;font-family:Inter,system-ui,sans-serif}
.tab.active{color:#0a84ff;border-bottom:2px solid #0a84ff}
.phone{background:linear-gradient(160deg,#1c2333,#080b10);box-shadow:0 0 0 1.5px #3a4558,0 20px 40px -10px rgba(0,0,0,.7)}
.link-btn:hover{transform:scale(1.02);opacity:.95}
.drag-over{border-color:rgba(10,132,255,.5)!important;background:rgba(10,132,255,.08)}
#toast{transition:opacity .3s}
.chip.on{border-color:#0a84ff;color:#0a84ff;background:rgba(10,132,255,.1)}
</style>
</head>
<body class="text-mist antialiased min-h-screen">
<header class="h-14 border-b border-white/5 bg-void/90 backdrop-blur flex items-center justify-between px-4 sticky top-0 z-30">
  <a href="index.html" class="font-semibold text-white text-sm">privacidad<span class="text-neon">.me</span></a>
  <div class="flex items-center gap-3">
    <a id="public-link" href="u.html" target="_blank" class="text-xs text-steel hover:text-white">Ver página →</a>
    <button id="btn-save" onclick="doSave(true)" class="px-4 py-1.5 rounded-lg bg-neon text-void text-sm font-semibold">Guardar</button>
    <a href="index.html" class="text-xs text-steel hover:text-white">Salir</a>
  </div>
</header>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl bg-panel border border-neon/30 text-sm text-white opacity-0 pointer-events-none z-50">Guardado</div>
<div class="max-w-6xl mx-auto p-4 lg:p-6 grid lg:grid-cols-2 gap-6">
  <div class="space-y-5 order-2 lg:order-1">
    <div class="flex gap-1 border-b border-white/5 overflow-x-auto text-sm">
      <button class="tab active px-3 py-2.5 whitespace-nowrap" data-tab="perfil" onclick="tab(this)">Perfil</button>
      <button class="tab px-3 py-2.5 whitespace-nowrap text-steel" data-tab="identidad" onclick="tab(this)">Identidad</button>
      <button class="tab px-3 py-2.5 whitespace-nowrap text-steel" data-tab="redes" onclick="tab(this)">Redes</button>
      <button class="tab px-3 py-2.5 whitespace-nowrap text-steel" data-tab="enlaces" onclick="tab(this)">Enlaces</button>
      <button class="tab px-3 py-2.5 whitespace-nowrap text-steel" data-tab="estilo" onclick="tab(this)">Estilo</button>
      <button class="tab px-3 py-2.5 whitespace-nowrap text-steel" data-tab="mas" onclick="tab(this)">Más</button>
    </div>
    <div id="t-perfil" class="space-y-4">
      <div class="p-4 rounded-xl bg-panel border border-white/10 space-y-3">
        <h3 class="text-sm text-white font-medium"><i class="fa-solid fa-image text-neon"></i> Apariencia</h3>
        <div class="flex items-center gap-4">
          <div id="av-wrap" class="w-16 h-16 rounded-full bg-void border-2 border-neon/40 overflow-hidden flex items-center justify-center text-steel shrink-0"></div>
          <div class="flex-1 space-y-2">
            <div><span class="text-[11px] text-steel">Avatar</span>
              <div class="flex gap-2 mt-1 flex-wrap">
                <label class="text-xs px-3 py-1.5 rounded-lg border border-neon/40 text-neon cursor-pointer">Subir<input type="file" accept="image/*" class="hidden" onchange="onAvatarFile(event)"></label>
                <button type="button" onclick="clearAvatar()" class="text-xs px-3 py-1.5 rounded-lg border border-white/10 text-steel">Quitar</button>
                <span class="text-[10px] text-steel/50 self-center" id="avatar-hint">Ninguna</span>
              </div></div>
            <div><span class="text-[11px] text-steel">Imagen de fondo</span>
              <div class="flex gap-2 mt-1 flex-wrap">
                <label class="text-xs px-3 py-1.5 rounded-lg border border-neon/40 text-neon cursor-pointer">Subir fondo<input type="file" accept="image/*" class="hidden" onchange="onBgFile(event)"></label>
                <button type="button" onclick="clearBg()" class="text-xs px-3 py-1.5 rounded-lg border border-white/10 text-steel">Quitar</button>
                <span class="text-[10px] text-steel/50 self-center" id="bg-hint">Ninguna</span>
              </div></div>
          </div>
        </div>
      </div>
      <div><label class="text-xs text-steel">Nombre</label>
        <input id="name" class="mt-1 w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white" oninput="onField()"></div>
      <div><label class="text-xs text-steel">Biografía</label>
        <textarea id="bio" rows="2" class="mt-1 w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white resize-none" oninput="onField()"></textarea></div>
      <div><label class="text-xs text-steel">Usuario · @</label>
        <input id="username" class="mt-1 w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white" oninput="onField()"></div>
      <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" id="verified" onchange="state.verified=this.checked;refresh();scheduleSave()"><span class="text-steel">Badge verificado</span></label>
    </div>
    <div id="t-identidad" class="hidden space-y-4">
      <div class="p-3 rounded-xl border border-neon/20 bg-neon/5 text-xs text-mist">
        <strong class="text-neon">Tarjeta de identidad (opcional).</strong> Bloque de contacto que el visitante puede guardar (.vcf). No es un enlace genérico.
      </div>
      <label class="flex items-center gap-3 p-4 rounded-xl bg-panel border border-white/10 cursor-pointer">
        <input type="checkbox" id="contact-enabled" onchange="onContactToggle()">
        <div><div class="text-sm text-white font-medium">Activar tarjeta de contacto</div>
        <div class="text-[11px] text-steel">Email, teléfono, web y «Guardar contacto»</div></div>
      </label>
      <div id="contact-fields" class="hidden space-y-3">
        <input id="c-title" class="w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="Cargo / título" oninput="onContactField()">
        <input id="c-org" class="w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="Organización" oninput="onContactField()">
        <textarea id="c-note" rows="2" class="w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white resize-none" placeholder="Nota" oninput="onContactField()"></textarea>
        <div class="grid sm:grid-cols-2 gap-3">
          <input id="c-email" class="w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="Email" oninput="onContactField()">
          <input id="c-phone" class="w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="Teléfono" oninput="onContactField()">
        </div>
        <input id="c-web" class="w-full bg-panel border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="https://" oninput="onContactField()">
      </div>
    </div>
    <div id="t-redes" class="hidden space-y-3"><div id="social-list" class="space-y-2"></div></div>
    <div id="t-enlaces" class="hidden space-y-3">
      <div class="flex gap-1.5 flex-wrap">
        <button onclick="addLink('link')" class="text-xs text-neon border border-neon/30 px-2.5 py-1.5 rounded-lg">+ Enlace</button>
        <button onclick="addLink('heading')" class="text-xs text-steel border border-white/10 px-2.5 py-1.5 rounded-lg">Título</button>
        <button onclick="addLink('text')" class="text-xs text-steel border border-white/10 px-2.5 py-1.5 rounded-lg">Texto</button>
        <button onclick="addLink('spacer')" class="text-xs text-steel border border-white/10 px-2.5 py-1.5 rounded-lg">Espacio</button>
      </div>
      <div id="link-list" class="space-y-2"></div>
    </div>
    <div id="t-estilo" class="hidden space-y-4">
      <p class="text-xs text-steel">Fondo y avatar están en <strong class="text-mist">Perfil → Apariencia</strong>.</p>
      <div class="flex gap-2 text-xs flex-wrap">
        <button type="button" onclick="setOpt('shape','rounded')" class="chip shape-btn px-3 py-2 rounded-xl border border-white/10 bg-panel" data-v="rounded">Redondeado</button>
        <button type="button" onclick="setOpt('shape','pill')" class="chip shape-btn px-3 py-2 rounded-full border border-white/10 bg-panel" data-v="pill">Píldora</button>
        <button type="button" onclick="setOpt('shape','square')" class="chip shape-btn px-3 py-2 rounded-md border border-white/10 bg-panel" data-v="square">Cuadrado</button>
      </div>
      <div class="flex gap-2 text-xs flex-wrap">
        <button type="button" onclick="setOpt('btnStyle','outline')" class="chip style-btn px-3 py-2 rounded-lg border border-white/10 bg-panel" data-v="outline">Contorno</button>
        <button type="button" onclick="setOpt('btnStyle','solid')" class="chip style-btn px-3 py-2 rounded-lg border border-white/10 bg-panel" data-v="solid">Sólido</button>
        <button type="button" onclick="setOpt('btnStyle','soft')" class="chip style-btn px-3 py-2 rounded-lg border border-white/10 bg-panel" data-v="soft">Suave</button>
        <button type="button" onclick="setOpt('btnStyle','ghost')" class="chip style-btn px-3 py-2 rounded-lg border border-white/10 bg-panel" data-v="ghost">Ghost</button>
      </div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="btnGlow" onchange="state.btnGlow=this.checked;refresh();scheduleSave()"><span class="text-steel">Glow</span></label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="sameTab" onchange="state.sameTab=this.checked;refresh();scheduleSave()"><span class="text-steel">Misma pestaña</span></label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="autosave" checked><span class="text-steel">Auto-guardar</span></label>
    </div>
    <div id="t-mas" class="hidden space-y-4">
      <button type="button" onclick="loadStarkDemo()" class="text-xs px-3 py-1.5 rounded-lg border border-neon/40 text-neon">Cargar demo @stark</button>
      <div id="domain-list" class="space-y-2"></div>
      <input id="ogTitle" placeholder="Título OG" class="w-full bg-void border border-white/10 rounded-lg px-3 py-2 text-sm text-white" oninput="state.ogTitle=this.value;scheduleSave()">
      <input id="ogDesc" placeholder="Descripción OG" class="w-full bg-void border border-white/10 rounded-lg px-3 py-2 text-sm text-white" oninput="state.ogDesc=this.value;scheduleSave()">
      <button type="button" onclick="exportJSON()" class="text-xs px-3 py-1.5 rounded-lg border border-neon/40 text-neon">Exportar JSON</button>
      <label class="text-xs px-3 py-1.5 rounded-lg border border-white/10 cursor-pointer">Importar<input type="file" accept="application/json" class="hidden" onchange="importJSON(event)"></label>
    </div>
  </div>
  <div class="order-1 lg:order-2 flex justify-center lg:sticky lg:top-20 lg:self-start">
    <div class="phone rounded-[2.5rem] p-2.5 w-[280px]">
      <div class="bg-void rounded-[2rem] overflow-hidden min-h-[520px] flex flex-col">
        <div class="flex justify-center pt-3 pb-1"><div class="w-20 h-5 bg-black rounded-full"></div></div>
        <div id="preview" class="flex-1 px-4 pb-6 pt-2 text-center overflow-y-auto max-h-[560px]"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/store.js"></script>
<script src="js/panel-app.js"></script>
</body>
</html>
