<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Privacidad.me</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{void:'#05070a',panel:'#0b0f14',neon:'#0a84ff',steel:'#8b9bb4',mist:'#c5d0e0'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
<style>
body{background:#05070a;font-family:Inter,system-ui,sans-serif;min-height:100vh}
.social-btn{transition:transform .15s,background .15s}
.social-btn:hover{transform:scale(1.08);background:rgba(255,255,255,.2)}
.link-btn{transition:transform .15s,opacity .15s}
.link-btn:hover{transform:scale(1.02);opacity:.95}
</style>
</head>
<body class="text-mist antialiased">
<div class="fixed top-4 right-4 z-20 flex gap-2">
  <button onclick="sharePage()" class="px-3 py-1.5 rounded-full bg-white/10 border border-white/15 text-xs text-white backdrop-blur hover:bg-white/20">
    <i class="fa-solid fa-share-nodes"></i> Compartir
  </button>
</div>
<div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
  <div id="page" class="w-full max-w-md text-center"><p class="text-steel text-sm">Cargando…</p></div>
  <p class="mt-8 text-[10px] text-steel/40"><a href="index.html" class="hover:text-steel">privacidad.me</a> · <a href="panel.html" class="hover:text-steel">editar</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  let u = new URLSearchParams(location.search).get('u') || '';
  if (!u && location.hash) u = location.hash.replace(/^#\/?@?/, '');
  u = PrivStore.sanitizeUsername(u || 'stark');
  let data = PrivStore.load(u);
  if (!data) {
    if (u === 'stark') data = PrivStore.starkDemo();
    else data = PrivStore.defaultPage(u);
  }
  document.title = (data.name || data.username) + ' — privtr.ee';
  PrivStore.renderProfile(data, document.getElementById('page'), { compact: false });
  window.sharePage = function () {
    const url = location.href;
    if (navigator.share) navigator.share({ title: data.name, url }).catch(function () {});
    else { navigator.clipboard.writeText(url); alert('Enlace copiado'); }
  };
})();
</script>
</body>
</html>
