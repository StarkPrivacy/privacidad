<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Privacidad.me</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{void:'#05070a',panel:'#0b0f14',neon:'#0a84ff',steel:'#8b9bb4',mist:'#c5d0e0'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{background:#05070a;font-family:Inter,system-ui,sans-serif;min-height:100vh}
.social-btn{transition:transform .15s,border-color .15s}
.social-btn:hover{transform:scale(1.08);border-color:rgba(10,132,255,.5)}
.link-btn{transition:border-color .15s,background .15s,transform .15s}
.link-btn:hover{border-color:rgba(10,132,255,.45);background:rgba(10,132,255,.06);transform:scale(1.01)}
</style>
</head>
<body class="text-mist antialiased">
<div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
  <div id="page" class="w-full max-w-md text-center"><p class="text-steel text-sm">Cargando…</p></div>
  <p class="mt-10 text-[10px] text-steel/40"><a href="index.html" class="hover:text-steel">privacidad.me</a>
    · <a href="panel.html" class="hover:text-steel">editar</a></p>
</div>
<script src="js/store.js"></script>
<script>
(function () {
  const u = new URLSearchParams(location.search).get('u') || 'stark';
  let data = PrivStore.load(u);
  if (!data) {
    data = PrivStore.defaultPage(u);
    if (u === 'stark') {
      data.name = 'Stark';
      data.bio = 'Sin privacidad tu libertad es solo una ilusión';
      data.avatar = 'https://pbs.twimg.com/profile_images/1691362458655440896/jaacLom0.jpg';
      data.social.x = 'https://x.com/StarkPrivacy';
      data.social.telegram = 'https://t.me/StarkPrivacy';
      data.links = [
        { id: 1, title: 'Academia Boring Privacy', url: 'https://boringprivacy.io' },
        { id: 2, title: 'Canal de Telegram', url: 'https://t.me/StarkPrivacy' },
        { id: 3, title: 'X / Twitter', url: 'https://x.com/StarkPrivacy' },
      ];
    }
  }
  document.title = (data.name || data.username) + ' — privtr.ee';
  PrivStore.renderProfile(data, document.getElementById('page'), { compact: false });
})();
</script>
</body>
</html>
