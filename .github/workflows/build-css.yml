name: build css

# Recompila assets/app.css a partir de src/input.css + tailwind.config.js y, si
# cambió, lo commitea. Así el CSS desplegado nunca se queda desincronizado del
# código aunque alguien olvide ejecutar ./build.sh antes de subir.

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'js/**'
      - 'src/input.css'
      - 'tailwind.config.js'
      - '.github/workflows/build-css.yml'

permissions:
  contents: write

concurrency:
  group: build-css-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar CSS
        run: npx --yes tailwindcss@3.4.17 -c ./tailwind.config.js -i ./src/input.css -o ./assets/app.css --minify

      - name: Commitear si cambió
        run: |
          if [ -n "$(git status --porcelain assets/app.css)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/app.css
            git commit -m "build: recompila assets/app.css [skip ci]"
            git push
          else
            echo "assets/app.css ya está al día."
          fi
