<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%230a84ff' stroke-width='3'/%3E%3C/svg%3E">
<title>Crear cuenta — privtr.ee</title>
<meta name="description" content="Regístrate en privtr.ee">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-void text-mist font-sans antialiased min-h-screen flex flex-col">
<nav class="border-b border-white/5 px-5 h-14 flex items-center justify-between">
  <a href="index.html" class="font-semibold text-white text-sm">privtr<span class="text-neon">.ee</span></a>
  <a href="acceso.html" class="text-sm text-steel hover:text-white">Ya tengo cuenta</a>
</nav>
<main class="flex-1 flex items-center justify-center px-5 py-12">
  <div class="w-full max-w-md">
    <h1 class="text-2xl font-semibold text-white mb-2">Crear tu página</h1>
    <p class="text-sm text-steel mb-8">Elige un nombre. Luego personalizas enlaces y perfil.</p>
    <form id="f" class="space-y-4" onsubmit="return go(event)">
      <div>
        <label class="text-xs text-steel">Tu enlace</label>
        <div class="mt-1 flex items-center rounded-xl border border-white/10 bg-panel overflow-hidden">
          <span class="text-steel text-sm font-mono px-3 shrink-0">privtr.ee/</span>
          <input type="hidden" id="domain" value="privtr.ee">
          <input id="username" type="text" required pattern="[a-zA-Z0-9_-]{2,32}" placeholder="tu-nombre"
            class="flex-1 bg-transparent text-white px-2 py-3 text-sm focus:outline-none min-w-0">
        </div>
        <p class="text-[11px] text-steel/60 mt-1.5">Solo letras, números, guiones. Luego puedes cambiar detalles del perfil.</p>
      </div>
      <div>
        <label class="text-xs text-steel">Nombre visible</label>
        <input id="name" type="text" class="mt-1 w-full rounded-xl border border-white/10 bg-panel px-3 py-3 text-sm text-white" placeholder="Cómo quieres que te vean">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-neon text-void font-semibold text-sm hover:opacity-90 transition">Continuar al panel</button>
    </form>
    <p class="mt-6 text-xs text-steel/50 text-center">Demo local: los datos se guardan en este navegador hasta conectar el servidor real.</p>
  </div>
</main>
<script src="js/store.js"></script>
<script>
function go(e) {
  e.preventDefault();
  const username = PrivStore.sanitizeUsername(document.getElementById('username').value);
  if (!username) return false;
  let page = PrivStore.load(username) || PrivStore.defaultPage(username);
  page.username = username;
  const n = document.getElementById('name').value.trim();
  if (n) page.name = n;
  page.preferredDomain = 'privtr.ee';
  PrivStore.save(page);
  location.href = 'panel.html?u=' + encodeURIComponent(username);
  return false;
}
const q = new URLSearchParams(location.search);
if (q.get('username')) document.getElementById('username').value = q.get('username');
</script>
</body>
</html>
