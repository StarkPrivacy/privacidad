<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrarse — Privacidad.me</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{void:'#05070a',panel:'#0b0f14',neon:'#0a84ff',steel:'#8b9bb4',mist:'#c5d0e0'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{background:#05070a}</style>
</head>
<body class="font-sans text-mist antialiased min-h-screen flex flex-col">
nav class="border-b border-white/5 h-14 flex items-center px-6 justify-between">
  <a href="index.html" class="font-semibold text-white text-sm">privacidad<span class="text-neon">.me</span></a>
  <a href="acceso.html" class="text-sm text-steel hover:text-white">Iniciar sesión</a>
</nav>
<main class="flex-1 flex items-center justify-center px-6 py-16">
  <div class="w-full max-w-md">
    <h1 class="text-xl font-bold text-white text-center mb-2">Crear cuenta</h1>
    <p class="text-steel text-sm text-center mb-6">Demo: el perfil se guarda en tu navegador.</p>
    <form class="p-6 rounded-2xl bg-panel border border-white/10 space-y-4" onsubmit="doReg(event)">
      <div>
        <label class="text-xs text-steel">Usuario</label>
        <div class="flex items-center mt-1 bg-void rounded-xl border border-white/10 overflow-hidden">
          <span class="px-3 text-sm text-steel border-r border-white/10">privtr.ee/</span>
          <input id="user" required class="flex-1 bg-transparent px-3 py-3 text-sm text-white focus:outline-none" placeholder="tu-nombre">
        </div>
      </div>
      <input type="email" placeholder="Correo" required class="w-full bg-void border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
      <input type="password" placeholder="Contraseña" required class="w-full bg-void border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
      <button type="submit" class="w-full py-3 rounded-xl bg-neon text-void font-semibold text-sm">Registrarse</button>
    </form>
  </div>
</main>
<script src="js/store.js"></script>
<script>
function doReg(e) {
  e.preventDefault();
  const u = PrivStore.sanitizeUsername(document.getElementById('user').value);
  if (!u) { alert('Usuario inválido'); return; }
  const page = PrivStore.defaultPage(u);
  page.name = u;
  PrivStore.save(page);
  location.href = 'panel.html';
}
const q = new URLSearchParams(location.search);
if (q.get('username')) document.getElementById('user').value = q.get('username');
</script>
</body>
</html>
